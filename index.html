<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="text/javascript" src="http://livejs.com/live.js"></script>
    <link rel="icon" href="favicon.ico">
    <title>bbbrother</title>

    <style>
        * {
            background-color: pink;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        img {
            width: 70vw;
            max-width: 800px;
            /* optional safety */
        }

        .links {
            margin-top: 24px;
            display: flex;
            gap: 24px;
            /* space between links */
        }

        .links a {
            text-decoration: none;
            color: black;
            font-size: 1.5rem;
        }

        .links a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <img src="logo.jpg" alt="">

    <div class="links">
        <a href="https://bbbrother.bandcamp.com/album/comfort-solutions">Bandcamp</a>
        <!-- <a href="#">Link Two</a> -->
    </div>
</body>

</html>
